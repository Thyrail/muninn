# Local infrastructure for development. Apps run on the host via `pnpm dev`.
name: muninn-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: muninn
      POSTGRES_PASSWORD: muninn
      POSTGRES_DB: muninn
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U muninn -d muninn']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage (see ADR-006). The API creates the bucket on startup.
  s3:
    image: chrislusf/seaweedfs:4.51
    command: ['server', '-s3', '-dir=/data', '-ip.bind=0.0.0.0']
    environment:
      AWS_ACCESS_KEY_ID: muninn
      AWS_SECRET_ACCESS_KEY: muninn-secret
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - s3-data:/data

volumes:
  postgres-data:
  redis-data:
  s3-data:
